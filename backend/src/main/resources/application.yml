spring:
  data:
    redis:
      port: 6379
      host: localhost
      password: ""
      # 连接池配置
      lettuce:
        pool:
          max-active: 8      # 最大连接数
          max-idle: 8        # 最大空闲连接数
          min-idle: 0        # 最小空闲连接数
          max-wait: -1ms     # 最大等待时间
      # 超时配置
      timeout: 3000ms        # 连接超时时间
      # 数据库索引
      database: 3
  datasource:
    url: jdbc:mysql://localhost:3306/wenji?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  autoconfigure:
    exclude:
      - dev.langchain4j.openai.spring.AutoConfig
      - dev.langchain4j.spring.LangChain4jAutoConfig
      - dev.langchain4j.community.store.embedding.redis.spring.RedisEmbeddingStoreAutoConfiguration

# 降级版开关：app.ai.enabled=false 时不注册 AI 组件（无需通义千问 API Key）
app:
  ai:
    enabled: false

langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QWEN_API_KEY}
      model-name: qwen-plus
      temperature: 0.8
      max-tokens: 200
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QWEN_API_KEY}
      model-name: qwen-plus
      temperature: 0.8
      max-tokens: 200
    embedding-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QWEN_API_KEY}
      model-name: text-embedding-v3
      dimension: 1024
  community:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 4          # 独立 DB，和业务缓存 (db=3) 隔离
logging:
  level:
    org.springframework.ai.chat.client.advisor: debug
    com.example.ai: debug
    com.baomidou.mybatisplus: debug

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-prefix: 
      table-underline: true
  mapper-locations: classpath*:com/example/Mapper/*.xml
  type-aliases-package: com.example.Pojo

# JWT 配置
jwt:
  secret: "wenji-jwt-secret-key-at-least-32-characters-long-for-security-2024"
